<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>熊本500円娯楽マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--green:#237a57;--dark:#18352b;--cream:#f6f8f5;--line:#dce5df}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:var(--cream);color:#26352e}
header{background:var(--dark);color:white;padding:22px 16px;text-align:center}
header h1{margin:0;font-size:clamp(22px,4vw,32px)}
header p{margin:8px 0 0;color:#d6e8de}
main{max-width:1180px;margin:20px auto;padding:0 14px;display:grid;grid-template-columns:340px 1fr;gap:16px}
.panel,.map-panel{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 3px 12px #163c2510}
h2{font-size:18px;margin:0 0 14px;color:var(--dark)}
label{display:block;font-weight:650;font-size:14px;margin:12px 0 6px}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd8d0;border-radius:8px;background:white}
input[type=range]{padding:0;accent-color:var(--green)}
textarea{min-height:75px;resize:vertical}
button{border:0;border-radius:8px;padding:10px 13px;background:var(--green);color:white;font-weight:700;cursor:pointer}
button.secondary{background:#e9f1ec;color:var(--dark)}
button.danger{background:#b74444}
button:disabled{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
#map{height:570px;border-radius:10px;z-index:1}
.map-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}
#status{font-size:13px;color:#557264;margin:8px 0}
.spot-list{margin-top:14px;display:grid;gap:9px}
.spot{border:1px solid var(--line);border-radius:9px;padding:10px}
.spot strong{display:block}
.spot small{color:#607368}
.spot-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.spot-actions button{font-size:12px;padding:7px}
.hidden{display:none!important}
.muted{font-size:12px;color:#718078}
.admin-box{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}
.report{border:1px solid var(--line);padding:9px;border-radius:8px;margin:8px 0;font-size:13px}
footer{text-align:center;color:#718078;padding:20px;font-size:12px}
@media(max-width:850px){
 main{grid-template-columns:1fr}
 #map{height:440px}
}
</style>
</head>
<body>

<header>
<h1>熊本500円娯楽マップ</h1>
<p>ワンコイン以下で楽しめる、熊本のスポットを見つけよう。</p>
</header>

<main>
<section class="panel">
<h2>スポットを探す</h2>

<label for="budget">予算上限：<span id="budgetValue">500</span>円</label>
<input id="budget" type="range" min="0" max="500" step="50" value="500">

<label for="genre">ジャンル</label>
<select id="genre">
<option value="">すべて</option>
<option>グルメ</option>
<option>自然</option>
<option>観光</option>
<option>体験</option>
</select>

<label for="keyword">キーワード</label>
<input id="keyword" placeholder="場所・説明・住所で検索">
<details class="admin-box">
<summary>＋ スポットを投稿する</summary>
<p class="muted">投稿には匿名認証を使用します。</p>

<form id="spotForm">
<label>スポット名</label>
<input name="name" maxlength="80" required>

<label>ジャンル</label>
<select name="genre" required>
<option value="グルメ">グルメ</option>
<option value="自然">自然</option>
<option value="観光">観光</option>
<option value="体験">体験</option>
</select>

<label>料金（0〜500円）</label>
<input name="cost" type="number" min="0" max="500" required>

<label>住所・場所</label>
<input name="address" maxlength="160" required>

<label>紹介文</label>
<textarea name="desc" maxlength="300" required></textarea>

<div class="row">
<div>
<label>緯度（任意）</label>
<input name="lat" type="number" step="any" placeholder="例：32.8031">
</div>
<div>
<label>経度（任意）</label>
<input name="lng" type="number" step="any" placeholder="例：130.7079">
</div>
</div>

<p><button type="submit">投稿する</button></p>
</form>
</details>
 
<div id="status">データを読み込んでいます…</div>
<div id="spotList" class="spot-list"></div>

<details class="admin-box">
<summary>＋ スポットを投稿する</summary>
<p class="muted">投稿には匿名認証を使用します。</p>

<form id="spotForm">
<label>スポット名</label>
<input name="name" maxlength="80" required>

<label>ジャンル</label>
<select name="genre" required>
<option value="グルメ">グルメ</option>
<option value="自然">自然</option>
<option value="観光">観光</option>
<option value="体験">体験</option>
</select>

<label>料金（0〜500円）</label>
<input name="cost" type="number" min="0" max="500" required>

<label>住所・場所</label>
<input name="address" maxlength="160" required>

<label>紹介文</label>
<textarea name="desc" maxlength="300" required></textarea>

<div class="row">
<div>
<label>緯度（任意）</label>
<input name="lat" type="number" step="any" placeholder="例：32.8031">
</div>
<div>
<label>経度（任意）</label>
<input name="lng" type="number" step="any" placeholder="例：130.7079">
</div>
</div>

<p><button type="submit">投稿する</button></p>
</form>
</details>
 
<div id="adminArea" class="hidden">
<div class="admin-box">
<h2>管理者メニュー</h2>
<p class="muted">管理者としてログイン中です。</p>

<div class="row">
<button id="seedButton" class="secondary" type="button">初期スポットを登録</button>
<button id="logoutButton" class="danger" type="button">ログアウト</button>
</div>

<h2 style="margin-top:18px">報告一覧</h2>
<div id="reportList"></div>
</div>
</div>

<div id="loginArea" class="admin-box">
<h2>管理者ログイン</h2>
<form id="loginForm">
<label>メールアドレス</label>
<input name="email" type="email" required>

<label>パスワード</label>
<input name="password" type="password" required>

<p><button type="submit" class="secondary">ログイン</button></p>
</form>
</div>
</div>
</section>

<section class="map-panel">
<div class="map-head">
<h2>熊本市周辺のマップ</h2>
<button id="exportButton" class="secondary" type="button">データを書き出す</button>
</div>
<div id="map"></div>
<p class="muted">地図上のマーカーを押すとスポットの詳細を確認できます。</p>
</section>
</main>

<footer>
掲載情報は投稿内容に基づきます。訪問前に料金・営業状況をご確認ください。
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
 getAuth,
 signInAnonymously,
 onAuthStateChanged,
 signInWithEmailAndPassword,
 signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
 getFirestore,
 collection,
 addDoc,
 deleteDoc,
 doc,
 onSnapshot,
 query,
 orderBy,
 serverTimestamp,
 getDocs,
 updateDoc
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyDKZVes9h_5iBEfhzqy6ffmmObPnB30Wes",
 authDomain: "kumamoto-500yen-map.firebaseapp.com",
 projectId: "kumamoto-500yen-map",
 storageBucket: "kumamoto-500yen-map.firebasestorage.app",
 messagingSenderId: "76434304305",
 appId: "1:76434304305:web:bdc391a9f2181494255410"
};

const ADMIN_UIDS = [
 "m9S5k6GpqsRK2ppjkla7klZF3pq2",
 "kk3Efbe0RTazdisM3znSa0I2amz1"
];

const SEED_SPOTS = [
 {
  name:"熊本市役所 展望ロビー",
  genre:"観光",
  cost:0,
  address:"熊本市中央区手取本町1-1",
  desc:"市役所の展望ロビーから熊本市街を眺められるスポット。",
  lat:32.8031,
  lng:130.7079
 },
 {
  name:"熊本城 二の丸広場",
  genre:"観光",
  cost:0,
  address:"熊本市中央区二の丸",
  desc:"熊本城を眺めながら散策できる広場。",
  lat:32.8062,
  lng:130.7021
 },
 {
  name:"水前寺江津湖公園",
  genre:"自然",
  cost:0,
  address:"熊本市東区広木町",
  desc:"江津湖周辺の自然を楽しみながら散歩できる公園。",
  lat:32.7656,
  lng:130.7443
 },
 {
  name:"ルフィ像（熊本県庁）",
  genre:"観光",
  cost:0,
  address:"熊本市中央区水前寺6丁目18-1",
  desc:"熊本県庁プロムナードに設置されたルフィ像。",
  lat:32.7901,
  lng:130.7415
 },
 {
  name:"商店街で500円グルメ探し",
  genre:"グルメ",
  cost:500,
  address:"熊本市中央区 下通・上通周辺",
  desc:"商店街を歩きながらワンコインで楽しめるグルメを探そう。",
  lat:32.8057,
  lng:130.7110
 },
 {
  name:"熊本市動植物園",
  genre:"体験",
  cost:500,
  address:"熊本市東区健軍5丁目14-2",
  desc:"動物や植物を楽しめる施設。入園料は最新情報を確認してください。",
  lat:32.7780,
  lng:130.7664
 }
];

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const spotsRef = collection(db,"spots");
const reportsRef = collection(db,"reports");

let currentUser = null;
let isAdmin = false;
let spots = [];
let markers = [];
let selectedMarker = null;

const map = L.map("map").setView([32.803,130.713],13);

L.tileLayer(
 "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
 {
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
 }
).addTo(map);

const $ = id => document.getElementById(id);

 // 地図をクリックした場所の位置情報を取得
map.on("click", function(e) {

 // 前に選択した仮マーカーを削除
 if(selectedMarker){
  map.removeLayer(selectedMarker);
 }

 // クリックした場所の緯度・経度
 const lat = e.latlng.lat;
 const lng = e.latlng.lng;

 // 仮マーカーを設置
 selectedMarker = L.marker([lat,lng]).addTo(map);

 // ポップアップを表示
 selectedMarker.bindPopup(
  "この場所を投稿地点に設定しました！"
 ).openPopup();

 // 投稿フォームに自動入力
 document.querySelector('[name="lat"]').value = lat.toFixed(6);
 document.querySelector('[name="lng"]').value = lng.toFixed(6);

});

const esc = value => String(value ?? "").replace(/[&<>"']/g,c=>({
 "&":"&amp;",
 "<":"&lt;",
 ">":"&gt;",
 '"':"&quot;",
 "'":"&#39;"
}[c]));

function visibleSpots(){
 const max = Number($("budget").value);
 const genre = $("genre").value;
 const word = $("keyword").value.trim().toLowerCase();

 return spots.filter(s =>
  Number(s.cost) <= max &&
  (!genre || s.genre === genre) &&
  (!word || [s.name,s.address,s.desc].some(v =>
   String(v || "").toLowerCase().includes(word)
  ))
 );
}

function render(){
 $("budgetValue").textContent = $("budget").value;

 const list = visibleSpots();

 $("spotList").innerHTML = list.length
 ? list.map(s => `
  <article class="spot">
   <strong>${esc(s.name)}</strong>
   <small>${esc(s.genre)} ・ ${Number(s.cost)}円</small>
   <p>${esc(s.desc)}</p>
   <small>${esc(s.address)}</small>
   <div class="spot-actions">
    <button type="button" class="secondary" data-pan="${esc(s.id)}">地図で見る</button>
    <button type="button" class="secondary" data-report="${esc(s.id)}">問題を報告</button>
    ${isAdmin ? `<button type="button" class="danger" data-delete="${esc(s.id)}">削除</button>` : ""}
   </div>
  </article>
 `).join("")
 : "<p>条件に合うスポットはありません。</p>";

 markers.forEach(m => map.removeLayer(m));
 markers = [];

 list.forEach(s => {
  if(
   s.lat != null &&
   s.lng != null &&
   Number.isFinite(Number(s.lat)) &&
   Number.isFinite(Number(s.lng))
  ){
   const marker = L.marker([Number(s.lat),Number(s.lng)])
    .addTo(map)
    .bindPopup(`
     <b>${esc(s.name)}</b><br>
     ${esc(s.genre)}・${Number(s.cost)}円<br>
     ${esc(s.desc)}
    `);

   markers.push(marker);
  }
 });

 $("status").textContent = `${list.length}件のスポットを表示中`;
}

$("budget").addEventListener("input",render);
$("genre").addEventListener("change",render);
$("keyword").addEventListener("input",render);

$("spotList").addEventListener("click",async e => {
 const pan = e.target.dataset.pan;
 const report = e.target.dataset.report;
 const del = e.target.dataset.delete;

 if(pan){
  const s = spots.find(x => x.id === pan);

  if(s && s.lat != null && s.lng != null){
   map.setView([Number(s.lat),Number(s.lng)],16);

   markers.forEach(m => {
    if(
     m.getLatLng().lat === Number(s.lat) &&
     m.getLatLng().lng === Number(s.lng)
    ){
     m.openPopup();
    }
   });
  }
 }

 if(report){
  const s = spots.find(x => x.id === report);
  const reason = prompt(`${s?.name || "このスポット"}の問題点を入力してください`);

  if(reason?.trim()){
   try{
    await addDoc(reportsRef,{
     spotId:report,
     spotName:s.name,
     reason:reason.trim(),
     createdBy:currentUser.uid,
     createdAt:serverTimestamp(),
     status:"未確認"
    });

    alert("報告を送信しました。");
   }catch(err){
    alert("報告できませんでした："+err.message);
   }
  }
 }

 if(del && isAdmin && confirm("このスポットを削除しますか？")){
  try{
   await deleteDoc(doc(db,"spots",del));
  }catch(err){
   alert("削除できませんでした："+err.message);
  }
 }
});

$("spotForm").addEventListener("submit",async e => {
 e.preventDefault();

 if(!currentUser){
  alert("認証中です。少し待ってから再度お試しください。");
  return;
 }

 const f = new FormData(e.target);
 const lat = f.get("lat");
 const lng = f.get("lng");

 const data = {
  name:String(f.get("name")).trim(),
  genre:f.get("genre"),
  cost:Number(f.get("cost")),
  address:String(f.get("address")).trim(),
  desc:String(f.get("desc")).trim(),
  lat:lat === "" ? null : Number(lat),
  lng:lng === "" ? null : Number(lng),
  seed:false,
  createdBy:currentUser.uid,
  createdAt:serverTimestamp()
 };

 try{
  await addDoc(spotsRef,data);

// 仮マーカーを削除
if(selectedMarker){
 map.removeLayer(selectedMarker);
 selectedMarker = null;
}

// フォームをリセット
e.target.reset();

alert("投稿しました。");
 }catch(err){
  alert("投稿できませんでした："+err.message);
 }
});

$("loginForm").addEventListener("submit",async e => {
 e.preventDefault();

 const f = new FormData(e.target);

 try{
  await signInWithEmailAndPassword(
   auth,
   String(f.get("email")),
   String(f.get("password"))
  );

  e.target.reset();
}catch(err){
  alert("ログインエラー: " + err.code + "\n" + err.message);
}
});

$("logoutButton").addEventListener("click",async() => {
 await signOut(auth);
});

$("seedButton").addEventListener("click",async() => {
 if(!isAdmin) return;

 try{
  const snap = await getDocs(spotsRef);
  const existing = new Set(snap.docs.map(d => d.data().name));
  let count = 0;

  for(const s of SEED_SPOTS){
   if(!existing.has(s.name)){
    await addDoc(spotsRef,{
     ...s,
     seed:true,
     createdBy:currentUser.uid,
     createdAt:serverTimestamp()
    });

    count++;
   }
  }

  alert(`${count}件の初期スポットを登録しました。`);
 }catch(err){
  alert("登録できませんでした："+err.message);
 }
});

$("exportButton").addEventListener("click",() => {
 const blob = new Blob(
  [JSON.stringify(spots,null,2)],
  {type:"application/json"}
 );

 const url = URL.createObjectURL(blob);
 const a = document.createElement("a");

 a.href = url;
 a.download = "kumamoto-500yen-spots.json";
 a.click();

 URL.revokeObjectURL(url);
});

onAuthStateChanged(auth,async user => {
 currentUser = user;

 if(!user){
  try{
   await signInAnonymously(auth);
  }catch(err){
   $("status").textContent = "認証エラー："+err.message;
  }
  return;
 }

 isAdmin = ADMIN_UIDS.includes(user.uid);

 $("adminArea").classList.toggle("hidden",!isAdmin);
 $("loginArea").classList.toggle("hidden",isAdmin);

 render();
});

onSnapshot(
 query(spotsRef,orderBy("createdAt","desc")),
 snap => {
  spots = snap.docs.map(d => ({
   id:d.id,
   ...d.data()
  }));

  render();
 },
 err => {
  $("status").textContent = "データ取得エラー："+err.message;
 }
);

onSnapshot(
 query(reportsRef,orderBy("createdAt","desc")),
 snap => {
  if(!isAdmin) return;

  $("reportList").innerHTML = snap.empty
   ? "<p class='muted'>報告はありません。</p>"
   : snap.docs.map(d => {
      const r = d.data();

      return `
       <div class="report">
        <b>${esc(r.spotName)}</b>
        <p>${esc(r.reason)}</p>
        <small>状態：${esc(r.status)}</small>
        <p>
         <button class="secondary" data-resolve="${d.id}">
          対応済みにする
         </button>
        </p>
       </div>
      `;
     }).join("");
 },
 () => {}
);

$("reportList").addEventListener("click",async e => {
 const id = e.target.dataset.resolve;

 if(id && isAdmin){
  try{
   await updateDoc(doc(db,"reports",id),{
    status:"対応済み"
   });
  }catch(err){
   alert("更新できませんでした："+err.message);
  }
 }
});
</script>
</body>
</html>
